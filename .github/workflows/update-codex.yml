name: Update Codex From Fork Releases
"on":
  schedule:
    # Three hours after each Bad3r/codex sync, which publishes the releases.
    - cron: "17 3-23/8 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: update-codex
  cancel-in-progress: false
jobs:
  # Runs the updater and the build without write access. A pin reaches main
  # only after the package it selects is built and in the binary cache.
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      fork: ${{ steps.update.outputs.fork }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com https://bad3r-nixos.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= bad3r-nixos.cachix.org-1:CWwJIEV6kogZP/xZPRXdT6hkKvs84haLxYgK9oF59JE=
      - name: Update fork.json
        id: update
        env:
          # Read-only token for API rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix shell --inputs-from . nixpkgs#python3 --command python3 packages/codex/update.py
          if git diff --quiet -- packages/codex/fork.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            {
              echo "changed=true"
              echo "fork=$(base64 --wrap=0 packages/codex/fork.json)"
            } >>"$GITHUB_OUTPUT"
          fi
      - name: Add swap
        # Compiling codex has run a 16 GiB runner out of memory.
        run: |
          sudo fallocate --length 24G /swap-codex
          sudo chmod 600 /swap-codex
          sudo mkswap /swap-codex
          sudo swapon /swap-codex
      - name: Confine the build's memory
        # The final links of codex page through swap for most of an hour. With
        # the whole machine under that pressure the runner agent stops
        # answering and GitHub drops the job ("The hosted runner lost
        # communication with the server") with no log. Builds run in the
        # daemon's cgroup; MemoryHigh reclaims and swaps that cgroup's pages
        # first and leaves RAM to the runner. It sets no hard cap, so the build
        # still has the whole swap file, and the store path is unchanged.
        run: |
          systemctl cat nix-daemon.service >/dev/null
          sudo systemctl set-property --runtime nix-daemon.service MemoryHigh=12G
          free -h
          df -h /
      - name: Build codex
        id: build
        # codex-voice, the variant Bad3r/nixos installs. That flake's
        # llm-agents input follows its nixpkgs, the branch named here, so the
        # build swaps this flake's pin for the head of that branch and yields
        # the store path a freshly updated Bad3r/nixos lock reads from the
        # cache. The path moves with that branch as well as with fork.json, so
        # this runs whether or not fork.json changed.
        env:
          NIXPKGS: Bad3r/nixpkgs
          BRANCH: nixpkgs-unstable
          PATHS: >-
            p: "${p.drvPath} ${p.outPath}"
        run: |
          rev=$(git ls-remote "https://github.com/$NIXPKGS" "refs/heads/$BRANCH")
          rev=${rev%%[[:space:]]*}
          if [[ -z $rev ]]; then
            echo "::error::$NIXPKGS has no branch $BRANCH"
            exit 1
          fi
          echo "nixpkgs: github:$NIXPKGS/$rev"
          paths=$(nix eval --raw --override-input nixpkgs "github:$NIXPKGS/$rev" \
            "path:$GITHUB_WORKSPACE#codex-voice" --apply "$PATHS")
          drv=${paths% *} out=${paths#* }
          echo "out=$out" >>"$GITHUB_OUTPUT"
          if nix path-info --store https://bad3r-nixos.cachix.org "$out" >/dev/null 2>&1; then
            echo "$out is in the cache"
            echo "built=false" >>"$GITHUB_OUTPUT"
          else
            nix build --no-link --print-build-logs "$drv^out"
            echo "built=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Report peak memory
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          cg=/sys/fs/cgroup$(systemctl show --property=ControlGroup --value nix-daemon.service)
          echo "nix-daemon peak: memory $(numfmt --to=iec <"$cg/memory.peak"), swap $(numfmt --to=iec <"$cg/memory.swap.peak")"
          free -h
          df -h /
      - name: Push codex to Cachix
        if: steps.build.outputs.built == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          OUT: ${{ steps.build.outputs.out }}
        run: nix run --inputs-from . nixpkgs#cachix -- push bad3r-nixos "$OUT"
  push:
    needs: update
    if: needs.update.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Commit fork.json
        env:
          FORK: ${{ needs.update.outputs.fork }}
        run: |
          release='"\(.version)-r\(.revision)"'
          old=$(jq -r "$release" packages/codex/fork.json)
          base64 --decode <<<"$FORK" >packages/codex/fork.json
          new=$(jq -r "$release" packages/codex/fork.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "codex: $old -> $new" packages/codex/fork.json
          git push origin HEAD:main
