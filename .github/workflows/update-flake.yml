name: Update Flake
on:
  workflow_call:
    inputs:
      packages:
        description: 'Space-separated list of specific packages to update (empty for all)'
        required: false
        type: string
        default: ''
      inputs:
        description: 'Space-separated list of specific inputs to update (empty for all)'
        required: false
        type: string
        default: ''
      pr-labels:
        description: 'Comma-separated list of labels to add to PRs'
        required: false
        type: string
        default: 'dependencies,automated'
      auto-merge:
        description: 'Enable auto-merge for created pull requests'
        required: false
        type: boolean
        default: false
    secrets:
      CLIENT_ID:
        description: 'GitHub App client ID'
        required: true
      APP_PRIVATE_KEY:
        description: 'GitHub App private key'
        required: true
jobs:
  discover:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-updates: ${{ steps.build-matrix.outputs.has-updates }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Build update matrix
        id: build-matrix
        env:
          PACKAGES: "${{ inputs.packages }}"
          INPUTS: "${{ inputs.inputs }}"
        run: .github/ci/discovery.py
  update:
    needs: discover
    if: needs.discover.outputs.has-updates == 'true'
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    # Read access only. Pushing and PR creation use the App token, which
    # is minted after the untrusted updater step has finished.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history needed so we can rebase existing update/* branches onto main.
          fetch-depth: 0
          # No credentials in .git/config: the updater must not be able to push.
          persist-credentials: false
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Stash CI scripts
        # Copy the CI scripts out before the updater runs, so a malicious
        # update.py cannot rewrite the script that later holds the App token.
        run: cp -r .github/ci "$RUNNER_TEMP/ci"
      - name: Prepare update branch
        # Reuse the existing update/* branch (if any) so manual fixups on
        # the open PR carry into the work tree. Rebase it onto main.
        env:
          TYPE: ${{ matrix.type }}
          NAME: ${{ matrix.name }}
        run: |
          if [[ "$TYPE" = package ]]; then
            branch="update/$NAME"
          else
            branch="update-$NAME"
          fi
          git fetch origin main
          if git fetch origin "$branch"; then
            echo "Reusing existing branch $branch"
            git checkout -B "$branch" "origin/$branch"
            if ! git rebase origin/main; then
              echo "::warning::Rebase of $branch onto main failed, discarding stale branch"
              git rebase --abort
              git reset --hard origin/main
            fi
          else
            git checkout -B "$branch" origin/main
          fi
      - name: Perform update
        id: update
        env:
          # Read-only token for API rate limits. No App token exists yet.
          GITHUB_TOKEN: ${{ github.token }}
          TYPE: ${{ matrix.type }}
          NAME: ${{ matrix.name }}
        run: |
          if [[ "$TYPE" = package ]]; then
            # Only load the devshell to update packages
            nix develop -c "$RUNNER_TEMP/ci/update.py" "$TYPE" "$NAME"
          else
            "$RUNNER_TEMP/ci/update.py" "$TYPE" "$NAME"
          fi
      - name: Generate GitHub App Token
        if: steps.update.outputs.updated == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create pull request
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_LABELS: ${{ inputs.pr-labels }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          CHANGELOG_URL: ${{ steps.update.outputs.changelog }}
          TYPE: ${{ matrix.type }}
          NAME: ${{ matrix.name }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          # Via env, not inline interpolation: updater output must never
          # reach a shell unquoted.
          NEW_VERSION: ${{ steps.update.outputs.new_version }}
        # create_pr.py publishes from a fresh clone. It never pushes from
        # this checkout, which the updater could have tampered with.
        run: |
          "$RUNNER_TEMP/ci/create_pr.py" "$TYPE" "$NAME" "$CURRENT_VERSION" "$NEW_VERSION"
  update-readme:
    needs: [discover, update]
    runs-on: ubuntu-slim
    if: always() && needs.discover.outputs.has-updates == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Regenerate README
        run: ./scripts/generate-package-docs.nu
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git diff --quiet README.md; then
            echo "No README changes"
            exit 0
          fi
          branch="update/readme"
          # Check if branch exists remotely and delete it
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch" || true
          fi
          git checkout -b "$branch"
          git add README.md
          git commit -m "README: regenerate package documentation"
          git push -u origin "$branch"
          gh pr create \
            --title "README: regenerate package documentation" \
            --body "Automated README regeneration after package updates." \
            --label "documentation,automated"
  summary:
    needs: [discover, update, update-readme]
    runs-on: ubuntu-slim
    if: always() && needs.discover.outputs.has-updates == 'true'
    steps:
      - name: Generate summary
        run: |-
          echo "## Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check overall status
          if [ "${{ contains(needs.update.result, 'failure') }}" = "true" ]; then
            echo "⚠️ Some updates failed. Check individual job logs for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All update jobs completed." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Configuration:" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-merge: ${{ inputs.auto-merge }}" >> $GITHUB_STEP_SUMMARY
